name: Сборка

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Сборка и тесты (Windows)
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - name: Получить исходники
        uses: actions/checkout@v7

      - name: Проверить компилятор
        run: gcc --version

      - name: Собрать
        run: mingw32-make

      - name: Прогнать тесты
        run: mingw32-make test

      - name: Приложить исполняемый файл
        uses: actions/upload-artifact@v7
        with:
          name: SnowRunnerTimeJumper
          path: build/SnowRunnerTimeJumper.exe
          if-no-files-found: error
