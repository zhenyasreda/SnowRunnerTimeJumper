name: Сборка

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Сборка и тесты (Windows)
    runs-on: windows-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить MinGW-w64
        run: choco install mingw -y --no-progress

      - name: Собрать
        run: mingw32-make

      - name: Прогнать тесты
        run: mingw32-make test

      - name: Приложить исполняемый файл
        uses: actions/upload-artifact@v4
        with:
          name: SnowRunnerTimeJumper
          path: build/SnowRunnerTimeJumper.exe
          if-no-files-found: error
